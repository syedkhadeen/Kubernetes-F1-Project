events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:5000;
    }

    upstream api_fetch_service {
        server api-fetch-service:5000;
    }

    upstream scraper_service {
        server scraper-service:5000;
    }

    upstream data_cleaner_service {
        server data-cleaner-service:5000;
    }

    upstream driver_service {
        server driver-service:5000;
    }

    upstream constructor_service {
        server constructor-service:5000;
    }

    upstream race_service {
        server race-service:5000;
    }

    upstream stats_service {
        server stats-service:5000;
    }

    upstream frontend_service {
        server frontend-service:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend routes
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth service routes
        location /auth/ {
            rewrite ^/auth/(.*) /$1 break;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Fetch service routes
        location /api-fetch/ {
            rewrite ^/api-fetch/(.*) /$1 break;
            proxy_pass http://api_fetch_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Scraper service routes
        location /scraper/ {
            rewrite ^/scraper/(.*) /$1 break;
            proxy_pass http://scraper_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Data cleaner service routes
        location /data-cleaner/ {
            rewrite ^/data-cleaner/(.*) /$1 break;
            proxy_pass http://data_cleaner_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Driver service routes
        location /drivers/ {
            rewrite ^/drivers/(.*) /$1 break;
            proxy_pass http://driver_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Constructor service routes
        location /constructors/ {
            rewrite ^/constructors/(.*) /$1 break;
            proxy_pass http://constructor_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Race service routes
        location /races/ {
            rewrite ^/races/(.*) /$1 break;
            proxy_pass http://race_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stats service routes
        location /stats/ {
            rewrite ^/stats/(.*) /$1 break;
            proxy_pass http://stats_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
