apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: racemetrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
      - name: frontend-service
        image: racemetrics/frontend-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: racemetrics-config

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: racemetrics
spec:
  selector:
    app: frontend-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: NodePort
