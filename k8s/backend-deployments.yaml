apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: racemetrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: racemetrics/auth-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          value: mongodb://mongo:27017/racemetrics
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: racemetrics-secrets
              key: JWT_SECRET

