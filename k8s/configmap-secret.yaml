apiVersion: v1
kind: ConfigMap
metadata:
  name: racemetrics-config
  namespace: racemetrics
data:
  REACT_APP_API_BASE_URL: "http://racemetrics.local"
  REACT_APP_AUTH_SERVICE_URL: "http://racemetrics.local/auth"
  REACT_APP_API_FETCH_SERVICE_URL: "http://racemetrics.local/api-fetch"
  REACT_APP_DRIVER_SERVICE_URL: "http://racemetrics.local/drivers"
  REACT_APP_CONSTRUCTOR_SERVICE_URL: "http://racemetrics.local/constructors"
  REACT_APP_RACE_SERVICE_URL: "http://racemetrics.local/races"
  REACT_APP_STATS_SERVICE_URL: "http://racemetrics.local/stats"

---
apiVersion: v1
kind: Secret
metadata:
  name: racemetrics-secrets
  namespace: racemetrics
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_YOUR_SECRET_KEY"
